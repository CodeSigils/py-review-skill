name: README contract

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: &readme_paths
      - ".github/workflows/ci.yml"
      - ".github/workflows/readme.yml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "scripts/validate-readme.py"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python3 scripts/validate-readme.py
