name: validate

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/**"
      - "skills/**"
      - "test-cases.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/**"
      - "skills/**"
      - "test-cases.json"
  schedule:
    - cron: "0 9 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-portability.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
