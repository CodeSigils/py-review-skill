name: validate

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths: &ci_paths
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/dependency-freshness.yml"
      - ".github/release.yml"
      - ".github/scripts/**"
      - ".gitignore"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
      - "tests/**"
      - "uv.lock"
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --locked --only-dev
      - run: >-
          uvx --from
          git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
          skills-ref validate skills/py-review
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ty check
      - run: python3 .github/scripts/check-portability.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate-compatibility.py
      - run: python3 scripts/check-runtime-matrix.py
      - run: python3 scripts/check-package-metadata.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/validate-review-fixtures.py
      - run: python3 scripts/run-codex-regression.py --self-test
      - run: python3 scripts/grade-codex-regression.py --self-test
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

  python-compat:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests
