name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths: &ci_paths
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/release.yml"
      - ".github/scripts/**"
      - ".gitignore"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
      - "uv.lock"
  pull_request:
    paths: *ci_paths
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check .
      - run: python3 .github/scripts/check-portability.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate-compatibility.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/validate-review-fixtures.py
      - run: python3 scripts/run-codex-regression.py --self-test
      - run: python3 scripts/grade-codex-regression.py --self-test
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
