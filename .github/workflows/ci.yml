name: validate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".gitignore"
      - "SECURITY.md"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".gitignore"
      - "SECURITY.md"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install ruff==0.15.21
      - run: python3 -m ruff check .
      - run: python3 .github/scripts/check-portability.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate-compatibility.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/validate-review-fixtures.py
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
