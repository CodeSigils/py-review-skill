name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
