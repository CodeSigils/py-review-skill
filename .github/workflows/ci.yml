name: validate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/**"
      - "review-fixtures.json"
      - "skills/**"
      - "test-cases.json"
  schedule:
    - cron: "0 9 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install ruff==0.15.21
      - run: python3 -m ruff check .
      - run: python3 .github/scripts/check-portability.py
      - run: python3 scripts/validate.py
      - run: python3 scripts/extract-tests.py --check
      - run: python3 scripts/validate-review-fixtures.py
      - run: python3 scripts/check-expiry.py
      - run: python3 scripts/verify-urls.py
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
